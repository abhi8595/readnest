apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

group = 'com.abhirahtech.readnest.tts'
version = '1.0.0'

android {
  compileSdk safeExtGet("compileSdkVersion", 35)
  namespace "com.abhirahtech.readnest.tts"

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 24)
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${safeExtGet("kotlinVersion", "2.1.0")}"
  implementation 'androidx.core:core:1.12.0'
}
